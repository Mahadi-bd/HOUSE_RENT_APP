name: CI and debug APK

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch: # Actions tab > "CI and debug APK" > Run workflow = build an APK on demand

jobs:
  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and test on the Firebase emulator
        working-directory: firebase
        run: |
          npm install
          npm test

  app:
    name: Build debug APK, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare project (platform folders, ids, patches, Firebase file)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash tools/ci_prepare.sh

      - run: flutter pub get
      - name: Save pubspec.lock (download it from the run and commit it)
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n

      # Style checks only report problems. They never stop the APK.
      - run: dart format --line-length=100 .
        continue-on-error: true
      - run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # Build the APK BEFORE the tests, so you get an APK even while some tests still fail.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: rent-solution-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # The tests decide whether the run is green or red.
      - run: flutter test --reporter expanded
